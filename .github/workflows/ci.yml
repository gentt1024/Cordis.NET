name: S10 Windows composition Git diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  manager:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Fetch fixed original sources and locked candidate tools
        shell: bash
        run: |
          git init ../dsh-candidate
          git -C ../dsh-candidate remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C ../dsh-candidate fetch --depth=1 origin 687f282e8625c6b8d11ff58211a90524be2e4317
          git -C ../dsh-candidate checkout --detach FETCH_HEAD
          git init ../origin-candidate
          git -C ../origin-candidate remote add origin https://github.com/cordiverse/cordis.git
          git -C ../origin-candidate fetch --depth=1 origin 56b3d4f725681cf4556c1a8695a709cc3b6eed74
          git -C ../origin-candidate checkout --detach FETCH_HEAD
          npm ci --prefix reference/candidate-tools --ignore-scripts --no-audit --no-fund
          node reference/candidate-bind-tools.mjs ../dsh-candidate
      - name: Replay unchanged original composition once with frozen production environment
        shell: pwsh
        run: |
          python reference/run-composition-git-diagnostic.py --dsh ../dsh-candidate --origin ../origin-candidate --output artifacts/composition-git-diagnostic
          exit $LASTEXITCODE
      - name: Summarize Git precheck timings without changing their outcomes
        if: always()
        shell: pwsh
        run: python reference/analyze-manager-git-trace.py artifacts/composition-git-diagnostic
      - name: Preserve all diagnostic outcomes including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composition-git-diagnostic
          path: artifacts/composition-git-diagnostic
          if-no-files-found: error
          retention-days: 14
