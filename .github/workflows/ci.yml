name: S10 macOS consumer cleanup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
jobs:
  cleanup-diagnostic:
    runs-on: macos-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out unchanged frozen production consumers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f32047a001919a14adefa6ce8a8d2c2936f07972
          path: consumer-source
          persist-credentials: false
      - name: Read frozen SDK version
        id: sdk
        shell: bash
        run: echo "version=$(python3 -c 'import json; print(json.load(open("consumer-source/global.json"))["sdk"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/cordis-dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Download original Linux packages for diagnosis only
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: validated-packages-ubuntu-24.04
          path: artifacts/portable-packages
          run-id: 39928987495
          github-token: ${{ github.token }}
      - name: Download original portable inputs for diagnosis only
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: portable-authoring-inputs
          path: artifacts/portable-inputs
          run-id: 39928987495
          github-token: ${{ github.token }}
      - name: Install unchanged consumer dependencies
        run: npm ci --prefix consumer-source/clients/modules --ignore-scripts
      - name: Prepare the production case-sensitive APFS temp volume
        shell: bash
        run: |
          mkdir -p artifacts/volume-setup
          hdiutil create -size 16g -type SPARSE -fs 'Case-sensitive APFS' \
            -volname CordisConsumerTemp "$RUNNER_TEMP/cordis-consumer.sparseimage" > artifacts/volume-setup/create.log 2>&1
          mkdir "$RUNNER_TEMP/cordis-consumer-volume"
          hdiutil attach "$RUNNER_TEMP/cordis-consumer.sparseimage" -nobrowse \
            -mountpoint "$RUNNER_TEMP/cordis-consumer-volume" > artifacts/volume-setup/attach.log 2>&1
          mkdir "$RUNNER_TEMP/cordis-consumer-volume/tmp"
          echo "TMPDIR=$RUNNER_TEMP/cordis-consumer-volume/tmp" >> "$GITHUB_ENV"
      - name: Replay nine consumers then inspect, shutdown, inspect and detach once
        shell: bash
        run: |
          python reference/diagnose-macos-consumer-cleanup.py \
            --source consumer-source --packages artifacts/portable-packages --inputs artifacts/portable-inputs \
            --output artifacts/macos-cleanup-diagnostic --mount "$RUNNER_TEMP/cordis-consumer-volume"
      - name: Preserve original consumer reports and every cleanup exit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-consumer-cleanup-diagnostic
          path: |
            artifacts/macos-cleanup-diagnostic
            artifacts/volume-setup
          if-no-files-found: error
          retention-days: 14
