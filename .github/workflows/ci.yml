name: S10 Windows manifest diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - name: Fetch fixed original source and locked tools
        shell: bash
        run: |
          git init ../dsh-candidate
          git -C ../dsh-candidate remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C ../dsh-candidate fetch --depth=1 origin 687f282e8625c6b8d11ff58211a90524be2e4317
          git -C ../dsh-candidate checkout --detach FETCH_HEAD
          npm ci --prefix reference/candidate-tools --ignore-scripts --no-audit --no-fund
          node reference/candidate-bind-tools.mjs ../dsh-candidate
      - name: Compare independent native and hook processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          node --experimental-transform-types reference/diagnose-candidate-manifest-scope.mjs --dsh=../dsh-candidate --reference=reference --output=artifacts/manifest-native-control.json
          $nativeExit = $LASTEXITCODE
          node --experimental-transform-types reference/diagnose-candidate-manifest-scope.mjs --dsh=../dsh-candidate --reference=reference --output=artifacts/manifest-hook-control.json --with-candidate-hook
          $hookExit = $LASTEXITCODE
          @{nativeExit=$nativeExit;hookExit=$hookExit;commit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content artifacts/exits.json
          if ($nativeExit -ne 0 -or $hookExit -ne 0) { throw 'One or both original assertions failed; inspect diagnostic evidence.' }
      - name: Preserve diagnostic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manifest-diagnostic
          path: artifacts
          if-no-files-found: error
          retention-days: 14
