name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: runtime (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Read only the version: setup-dotnet also interprets global.json rollForward.
      - name: Read verification SDK version
        id: sdk
        shell: pwsh
        run: |
          $version = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/cordis-dotnet
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Confirm selected SDK
        shell: pwsh
        env:
          EXPECTED_SDK: ${{ steps.sdk.outputs.version }}
        run: |
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SDK) {
            throw "Expected SDK $env:EXPECTED_SDK; selected $actual"
          }
          Write-Output "Verification SDK: $actual"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: |
            reference/package-lock.json
            clients/modules/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Check canonical C# formatting and formatter agreement
        run: python scripts/format.py --check
      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev
      - name: Confirm Windows Native AOT toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC x64 build tools are unavailable.' }
          Write-Output "MSVC installation: $installation"
      - name: Fetch read-only pinned reference
        shell: bash
        run: |
          git init ../dsh-reference
          git -C ../dsh-reference remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C ../dsh-reference fetch --depth=1 origin "$(python -c 'import json; print(json.load(open("upstream.lock.json"))["harness"]["commit"])')"
          git -C ../dsh-reference checkout --detach FETCH_HEAD
          git init ../upstream-cordis
          git -C ../upstream-cordis remote add origin https://github.com/cordiverse/cordis.git
          git -C ../upstream-cordis fetch --depth=1 origin 56b3d4f725681cf4556c1a8695a709cc3b6eed74
          git -C ../upstream-cordis checkout --detach FETCH_HEAD
          npm ci --prefix reference --ignore-scripts
          npm ci --prefix clients/modules --ignore-scripts
      - name: Verify package inspector regression
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Verify
        shell: bash
        run: |
          python scripts/check-docs.py
          python scripts/verify.py --dsh ../dsh-reference --origin ../upstream-cordis --defer-upstream-source-tests --aot --package --package-output artifacts/ci-packages
          python scripts/verify-authoring.py --verification artifacts/verification/verification.json --aot --packages artifacts/ci-packages
      - name: Preserve validated packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-packages-${{ matrix.os }}
          path: artifacts/ci-packages
          if-no-files-found: error
          retention-days: 14
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.os }}
          path: |
            artifacts/verification
            artifacts/authoring
            artifacts/clr-deployment-*/results.json
            artifacts/clr-deployment-*/*.log
          if-no-files-found: warn
          retention-days: 14

  upstream:
    name: upstream (${{ matrix.os }}, shard ${{ matrix.shard }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: reference/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Fetch read-only pinned references
        shell: bash
        run: |
          git init ../dsh-reference
          git -C ../dsh-reference remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C ../dsh-reference fetch --depth=1 origin "$(python -c 'import json; print(json.load(open("upstream.lock.json"))["harness"]["commit"])')"
          git -C ../dsh-reference checkout --detach FETCH_HEAD
          git init ../upstream-cordis
          git -C ../upstream-cordis remote add origin https://github.com/cordiverse/cordis.git
          git -C ../upstream-cordis fetch --depth=1 origin 56b3d4f725681cf4556c1a8695a709cc3b6eed74
          git -C ../upstream-cordis checkout --detach FETCH_HEAD
          npm ci --prefix reference --ignore-scripts
      - name: Execute original upstream cases
        run: python scripts/verify_upstream.py run --dsh ../dsh-reference --origin ../upstream-cordis --shard ${{ matrix.shard }}
      - name: Preserve shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            artifacts/upstream-shard-${{ matrix.shard }}/*.json
            artifacts/upstream-shard-${{ matrix.shard }}/*.log
          if-no-files-found: error
          retention-days: 14

  # Preserve the required-check names. Runtime success alone cannot satisfy them.
  verify:
    name: verify (${{ matrix.os }})
    if: always()
    needs: [runtime, upstream]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-24.04
            platform: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Require every runtime and upstream job
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          UPSTREAM_RESULT: ${{ needs.upstream.result }}
        run: test "$RUNTIME_RESULT" = success && test "$UPSTREAM_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: upstream-${{ matrix.os }}-*
          path: artifacts/upstream-results
      - name: Require complete original case union
        run: python scripts/verify_upstream.py aggregate --input artifacts/upstream-results --platform ${{ matrix.platform }}
      - name: Preserve upstream summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-summary-${{ matrix.os }}
          path: artifacts/upstream-results/summary.json
          if-no-files-found: error
          retention-days: 14
